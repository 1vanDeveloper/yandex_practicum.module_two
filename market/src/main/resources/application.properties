spring.application.name=market
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/market
spring.r2dbc.username=user
spring.r2dbc.password=password
spring.r2dbc.pool.initial-size=10
spring.r2dbc.pool.max-size=10
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.reactive.max-chunk-size=8192
spring.thymeleaf.check-template-location=true

# Payments API configuration
payments.api.base-url=http://localhost:8081

# Redis configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis

# OAuth2 Client Configuration (Keycloak) - for user login
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8180/realms/marketplace
spring.security.oauth2.client.provider.keycloak.authorization-uri=${spring.security.oauth2.client.provider.keycloak.issuer-uri}/protocol/openid-connect/auth
spring.security.oauth2.client.provider.keycloak.token-uri=${spring.security.oauth2.client.provider.keycloak.issuer-uri}/protocol/openid-connect/token
spring.security.oauth2.client.provider.keycloak.user-info-uri=${spring.security.oauth2.client.provider.keycloak.issuer-uri}/protocol/openid-connect/userinfo
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=${spring.security.oauth2.client.provider.keycloak.issuer-uri}/protocol/openid-connect/certs
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username

spring.security.oauth2.client.registration.keycloak.client-id=market-client
spring.security.oauth2.client.registration.keycloak.client-secret=market-secret
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code

# Payments OAuth2 Client Credentials Configuration
keycloak.token-uri=${spring.security.oauth2.client.provider.keycloak.token-uri}
keycloak.client-id=payment-resource
keycloak.client-secret=payment-secret


